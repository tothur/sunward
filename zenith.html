<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Sunward</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: the sky is the page. One pane on phones (sky above, cards below, floating tabs),
   two panes on foldables/tablets (sky stays put, content scrolls beside it),
   three columns on laptops (sky | today + year | events). Single dark look: the palette follows the sun, not the OS theme. */
:root{
  color-scheme:dark;
  --ink:#f4f6fb; --ink-2:rgba(236,240,250,.68); --ink-3:rgba(236,240,250,.42);
  --line:rgba(255,255,255,.09); --card:rgba(255,255,255,.055); --card-2:rgba(255,255,255,.09);
  --pane:#070b16; --accent:#8fb8ff;
  --sun:#ff9d4d; --gold:#ffd166; --blue:#6aa8ff; --violet:#9a86ff; --noon:#ffffff;
  --b-night:#0a0e26; --b-astro:#1d1a4d; --b-naut:#3b2a73; --b-civil:#8a4a86; --b-gold:#f2a268; --b-day:#62b2f2;
  --display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --ui:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--pane);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.4;overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,.hero:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
small{font-size:.62em;font-weight:500;letter-spacing:.04em;margin-left:.2em;opacity:.75}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.app{height:100%;overflow-y:auto;overscroll-behavior:contain}

/* ───────── Sky ───────── */
.hero{position:relative;height:72%;min-height:430px;overflow:hidden;container-type:size;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;background:#000}
.sky{position:absolute;inset:0 0 auto 0;height:var(--hy,62%);overflow:hidden;--sg:var(--s-top,#0b1030) 0%,var(--s-up,#101c48) 36%,var(--s-mid,#16214f) 64%,var(--s-low,#23306a) 86%,var(--s-hor,#2a2f6e) 100%;background:linear-gradient(to bottom,var(--sg));background:linear-gradient(to bottom in oklab,var(--sg))}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;opacity:var(--stars,0)}
.sky .tw{animation:tw 3.6s ease-in-out infinite alternate}
@keyframes tw{from{filter:opacity(.25)}to{filter:opacity(1)}}
.glow{position:absolute;left:0;top:0;width:140cqmin;height:140cqmin;border-radius:50%;translate:calc(var(--sx,0px) - 50%) calc(var(--sy,0px) - 50%);background:radial-gradient(circle,var(--glow,transparent) 0,transparent 19%),radial-gradient(circle,var(--glow2,transparent) 0,transparent 60%);opacity:var(--glow-a,0);will-change:translate}
.sky::after{content:"";position:absolute;inset:auto 0 0 0;height:70%;background:radial-gradient(ellipse 30% 55% at var(--sx,50%) 100%,var(--hglow,transparent),transparent 72%),radial-gradient(ellipse 115% 34% at var(--sx,50%) 100%,var(--hglow2,transparent),transparent 74%),radial-gradient(ellipse 85% 62% at calc(100% - var(--sx,50%)) 100%,var(--venus,transparent),transparent 72%)}
.sunlayer{position:absolute;inset:0 0 auto 0;height:var(--hy,62%);overflow:hidden;pointer-events:none}
.disc{position:absolute;left:0;top:0;width:var(--ds,28px);height:var(--ds,28px);border-radius:50%;translate:calc(var(--sx,0px) - 50%) calc(var(--sy,0px) - 50%);scale:1 var(--sq,1);opacity:var(--disc-a,0);
  background:radial-gradient(circle,var(--d0,#fff) 0,var(--d0,#fff) 38%,var(--d1,#fff) 78%,var(--d2,#fff) 100%);
  box-shadow:0 0 calc(var(--ds,28px)*.22) var(--d1,#fff),0 0 calc(var(--ds,28px)*.9) var(--d2,#fff),0 0 calc(var(--ds,28px)*2.6) var(--d3,transparent)}
.ground{position:absolute;inset:var(--hy,62%) 0 0 0;background:linear-gradient(to bottom,var(--g-top,#05060c),#020308 60%)}
.ground::before{content:"";position:absolute;inset:0 0 auto 0;height:46%;background:radial-gradient(ellipse 16% 100% at var(--sx,50%) 0,var(--refl,transparent),transparent 78%),radial-gradient(ellipse 75% 26% at var(--sx,50%) 0,var(--refl2,transparent),transparent 72%)}
.curve{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.curve text{font:500 10px var(--ui);fill:rgba(255,255,255,.5);text-anchor:middle;letter-spacing:.04em}

.hero{--foot:16px}
.hero-top{position:absolute;inset:0 0 auto 0;padding-top:14px;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);font-weight:500;font-size:14px;cursor:pointer;transition:background .2s,transform .2s var(--ease)}
.pill:hover{background:rgba(255,255,255,.22)}
.pill:active{transform:scale(.96)}
.pill svg{width:14px;height:14px;flex:none}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46cqw}
.headline{position:absolute;left:0;right:0;top:clamp(58px,12cqh,96px);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
.headline>div{min-width:0}
.eyebrow{font-size:clamp(12px,2.6cqh,14px);font-weight:500;letter-spacing:.02em;color:rgba(255,255,255,.78)}
h1{margin:.04em 0 .06em;font:400 clamp(34px,min(11.5cqw,12.5cqh),84px)/1 var(--display);letter-spacing:-.01em;text-wrap:balance}
h1 i{font-style:italic}
.next{margin:0;font-size:clamp(14px,3cqh,18px);color:rgba(255,255,255,.82)}
.next b{font-weight:600;color:#fff}
.ring{flex:none;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:500;color:rgba(255,255,255,.8);margin-top:6px}
.ring svg{width:44px;height:44px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.2)}
.ring .fg{stroke:#fff;transition:stroke-dashoffset .4s}
.hero-foot{position:absolute;inset:auto 0 0 0;padding-bottom:var(--foot);display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;pointer-events:none}
.hero-foot div{display:grid;gap:1px}
.hero-foot div:nth-child(2){text-align:center}
.hero-foot div:last-child{text-align:right}
.hero-foot .k{color:rgba(255,255,255,.5)}
.hero-foot .v{font-size:clamp(16px,3.6cqh,20px);font-weight:500}
.back{position:absolute;left:50%;bottom:calc(var(--foot) + 58px);transform:translateX(-50%);background:rgba(255,255,255,.92);color:#0b1020;font-weight:600;animation:pop .35s var(--ease)}
.back:hover{background:#fff}
.back:active{transform:translateX(-50%) scale(.96)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.94)}}
.hint{position:absolute;left:0;right:0;bottom:calc(var(--foot) + 62px);text-align:center;font-size:12px;color:rgba(255,255,255,.45);pointer-events:none;transition:opacity .5s}
.hint.off{opacity:0}

/* ───────── Pane ───────── */
.pane{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:none;animation:viewIn .5s var(--ease)}
@keyframes viewIn{from{opacity:.4;transform:translateY(10px)}}
.app[data-tab=today] #overview,.app[data-tab=year] #year,.app[data-tab=events] #events{display:block}
.k{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
h2{margin:0;font:400 30px/1.05 var(--display);letter-spacing:-.005em}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 2px 14px}

.tabs{--n:4;position:fixed;z-index:20;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;grid-template-columns:repeat(var(--n),1fr);padding:5px;border-radius:26px;background:rgba(22,26,40,.62);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 12px 40px rgba(0,0,0,.4)}
.tabs::before{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/var(--n));border-radius:21px;background:rgba(255,255,255,.13);transform:translateX(calc(var(--i,0)*100%));transition:transform .45s var(--ease)}
.tabs button{position:relative;display:grid;justify-items:center;gap:2px;min-width:72px;padding:7px 8px 6px;font-size:11px;font-weight:500;color:var(--ink-2);transition:color .25s;border-radius:21px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{color:var(--accent)}
.tabs svg{width:20px;height:20px}
.tabs .wide{display:none}
.app[data-tab=sky] .pane{display:none}
.app[data-tab=sky] .hero{height:100%}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;animation:rise .8s var(--ease) both;animation-delay:calc(var(--n,0)*80ms + 150ms)}
@keyframes rise{from{opacity:.4;transform:translateY(16px)}}
.card.wide{grid-column:1/-1}
.card h3{margin:0 0 12px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.big{font:400 28px/1.1 var(--display)}
.sub{color:var(--ink-2);font-size:13px}
.split{display:flex;align-items:center;justify-content:space-between;gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:14px 10px;margin-top:16px}
.stats div{display:grid;gap:2px;min-width:0;align-content:start}
.stats .v{font-size:19px;font-weight:500;white-space:nowrap}
.up{color:#7fe0a5}.down{color:#ffb38a}

.bar{position:relative;height:16px;border-radius:8px}
.bar i{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;border-radius:2px;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 12px rgba(255,255,255,.8)}
.scale{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;font-weight:500;color:var(--ink-3);letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:11px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px}

.rows{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);transition:opacity .3s}
.row:last-child{border-bottom:0}
.row .dot{flex:none;width:9px;height:9px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor}
.row .l{flex:1;min-width:0;display:grid}
.row .l span{font-weight:500}
.row .l em{font-style:normal;font-size:12px;color:var(--ink-3)}
.row .t{font-size:16px;font-weight:500;white-space:nowrap;text-align:right}
.row .t em{display:block;font-style:normal;font-size:12px;font-weight:400;color:var(--ink-3)}
.row.past{opacity:.42}
.nowline{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.nowline::before,.nowline::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
.nowline::after{transform:scaleX(-1)}
.mini{display:grid;gap:9px}
.mini div{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mini span{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.mini span i{width:8px;height:8px;border-radius:50%}
.mini b{font-weight:500;white-space:nowrap}
.big i{font-style:italic;color:var(--accent)}
.wave{position:relative;height:78px;margin-top:16px}
.wave svg{display:block;width:100%;height:100%;overflow:visible}
.wave i{position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.wave i.now{width:13px;height:13px;margin:-6.5px;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22),0 0 14px #fff}
.wlab{position:relative;height:18px;margin-top:8px;font-size:11px;font-weight:500;color:var(--ink-2)}
.wlab span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.wlab .r{right:0;transform:none}
.row svg{flex:none;margin:0 -4.5px}
.turn{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:8px}
.tp{display:grid;justify-items:start;align-content:start;gap:2px;text-align:left;padding:12px;border-radius:16px;border:1px solid transparent;transition:background .2s,border-color .2s}
.tp:hover{background:var(--card-2)}
.tp.on{background:var(--card);border-color:var(--line);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.tp svg{margin-bottom:8px}
.tp .tn{font-size:12px;color:var(--ink-2)}
.tp .td{font-size:19px;font-weight:500}
.prog{height:5px;border-radius:3px;background:var(--card-2);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .5s var(--ease)}

.chartbox{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);touch-action:pan-y;cursor:crosshair;aspect-ratio:1/1.05;max-height:560px;width:100%}
.chartbox canvas{display:block;width:100%;height:100%}

/* ───────── Places sheet ───────── */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(2,4,10,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;align-items:end;justify-items:center;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,460px);max-height:86%;display:flex;flex-direction:column;background:#141826;border:1px solid var(--line);border-radius:26px 26px 0 0;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .45s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 14px}
.sheet input::placeholder{color:var(--ink-3)}
.sheet .list{overflow-y:auto;margin-top:8px;min-height:120px}
.place{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.place .orb{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.place .l{flex:1;min-width:0;display:grid}
.place .l b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place .l em{font-style:normal;font-size:12px;color:var(--ink-3)}
.place .t{text-align:right;font-weight:500;white-space:nowrap}
.place .t em{display:block;font-style:normal;font-size:12px;font-weight:400;color:var(--ink-3)}
.place[aria-current=true] .l b{color:var(--accent)}
.rm{flex:none;width:28px;height:28px;border-radius:50%;color:var(--ink-3);font-size:18px;line-height:1}
.rm:hover{background:var(--card-2);color:var(--ink)}
.btn{height:36px;padding:0 14px;border-radius:18px;background:var(--card-2);font-weight:500;font-size:14px}
.btn:hover{background:rgba(255,255,255,.16)}
.toast{position:fixed;z-index:60;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:#f4f6fb;color:#0b1020;font-weight:500;font-size:14px;padding:10px 16px;border-radius:16px;animation:fade .3s}

/* ───────── Two panes: foldables, tablets, landscape phones ───────── */
@media (min-width:700px){
  .app{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,46%);grid-template-rows:minmax(0,1fr);overflow:hidden}
  .app[data-tab=sky]{grid-template-columns:minmax(0,1fr)}
  .hero{height:100%;min-height:0}
  .pane{height:100%;overflow-y:auto;overscroll-behavior:contain;padding-block:calc(78px + env(safe-area-inset-top,0px)) 28px}
  .tabs{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));left:auto;bottom:auto;transform:none;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .tabs button{grid-auto-flow:column;align-items:center;gap:7px;font-size:13px;padding:9px 13px;min-width:0}
  .tabs svg{width:17px;height:17px}
  .tabs span{display:none}
  .scrim{align-items:center}
  .sheet{border-radius:26px;max-height:min(86%,640px)}
}
@media (min-width:900px){.tabs span{display:inline}}
@media (max-width:699.98px){
  .app:not([data-tab=today]):not([data-tab=sky]) .hero{display:none}
  .app:not([data-tab=today]) .pane{padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .app[data-tab=sky] .hero{--foot:calc(92px + env(safe-area-inset-bottom,0px))}
}
/* ───────── Dashboard: laptops and up can show everything at once ───────── */
@media (min-width:1240px){
  .tabs{--n:5}
  .tabs .wide{display:grid}
  .app[data-tab=all]{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr)}
  .app[data-tab=all] .pane{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.62fr);grid-template-areas:"overview events" "year events";gap:28px 24px;align-content:start}
  .app[data-tab=all] .pane .view{display:block;animation:none}
  #overview{grid-area:overview}#year{grid-area:year}#events{grid-area:events}
}
/* Dual-screen and folded postures: put the sky on one segment, content on the other */
@media (horizontal-viewport-segments:2){
  .app{display:grid;grid-template-columns:env(viewport-segment-width 0 0) minmax(0,1fr);grid-template-rows:minmax(0,1fr);column-gap:calc(env(viewport-segment-left 1 0) - env(viewport-segment-right 0 0));overflow:hidden}
}
@media (vertical-viewport-segments:2){
  .app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:env(viewport-segment-height 0 0) minmax(0,1fr);row-gap:calc(env(viewport-segment-top 0 1) - env(viewport-segment-bottom 0 0));overflow:hidden}
  .app .hero{display:block;height:100%;min-height:0}
  .pane{overflow-y:auto;height:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="app" id="app" data-tab="today">
  <section class="hero" id="hero" tabindex="0" role="slider" aria-label="Time of day. Drag or use arrow keys to move through the day." aria-valuemin="0" aria-valuemax="24">
    <div class="sky"><canvas id="st1"></canvas><canvas id="st2" class="tw"></canvas><div class="glow"></div></div>
    <div class="ground"></div>
    <svg class="curve" id="curve" aria-hidden="true"></svg>
    <div class="sunlayer"><div class="disc"></div></div>
    <div class="hero-top gut">
      <button class="pill" id="locBtn" aria-haspopup="dialog"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M14.6 1.4 1.7 6.5c-.5.2-.5.9 0 1.1l4.9 1.8 1.8 4.9c.2.5.9.5 1.1 0z"/></svg><span id="locName">—</span></button>
      <button class="pill" id="hcBtn" aria-label="Switch between 12-hour and 24-hour time"></button>
      <button class="pill" id="instBtn" hidden>Install</button>
    </div>
    <div class="headline gut">
      <div>
        <div class="eyebrow" id="hDate"></div>
        <h1 id="hPhase"></h1>
        <p class="next" id="hNext"></p>
      </div>
      <div class="ring" title="Daylight remaining today">
        <svg viewBox="0 0 44 44"><circle class="tr" cx="22" cy="22" r="19"/><circle class="fg" id="ringFg" cx="22" cy="22" r="19" pathLength="100" stroke-dasharray="100"/></svg>
        <span id="ringTxt"></span>
      </div>
    </div>
    <div class="hint" id="hint">Drag across the sky to move through the day</div>
    <button class="pill back" id="backBtn" hidden>Back to now</button>
    <div class="hero-foot gut">
      <div><span class="k">Sunrise</span><span class="v" id="fRise"></span></div>
      <div><span class="k">Daylight</span><span class="v" id="fLen"></span></div>
      <div><span class="k">Sunset</span><span class="v" id="fSet"></span></div>
    </div>
  </section>

  <main class="pane gut" id="pane">

    <section class="view" id="overview" aria-label="Today">
      <div class="cards">
        <div class="card wide" style="--n:0" id="cLight"></div>
        <div class="card wide" style="--n:1" id="cSol"></div>
        <div class="card" style="--n:1" id="cPath"></div>
        <div class="card" style="--n:2" id="cMoon"></div>
        <div class="card" style="--n:3" id="cHours"></div>
        <div class="card" style="--n:4" id="cSeason"></div>
      </div>
    </section>

    <section class="view" id="year" aria-label="Year">

    x.beginPath();tb.forEach((d,i)=>x.lineTo(X(i),Y(d.noon)));x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=1;x.stroke();
    x.restore();
    x.font='500 10px Geist,system-ui,sans-serif';x.textBaseline='middle';
    x.strokeStyle='rgba(255,255,255,.08)';x.fillStyle='rgba(255,255,255,.55)';x.textAlign='right';
    for(let hh=0;hh<=24;hh+=3){const y=Y(hh);if(hh%6===0||H>380){x.beginPath();x.moveTo(L,y);x.lineTo(L+w,y);x.stroke();if(hh%6===0||H>460)x.fillText(hourLbl(hh%24),L-6,y)}}
    x.textAlign='center';
    for(let m=0;m<12;m++){const i0=Math.round((Date.UTC(year,m,1)-tb[0].w)/DAY),i1=Math.round((Date.UTC(year,m+1,1)-tb[0].w)/DAY);
      if(m){x.beginPath();x.moveTo(X(i0),Tp);x.lineTo(X(i0),Tp+h);x.stroke()}
      const nm=fmt('UTC','M',{month:'short'}).format(Date.UTC(year,m,15));x.fillText(w<430?nm.slice(0,1):nm,X((i0+Math.min(i1,n-1))/2),13)}
    for(let k=0;k<4;k++){const i=Math.round((getDay(loc,seasonPoint(year,k)).wallMid-tb[0].w)/DAY);if(i<0||i>=n)continue;const px=X(i),f=tb[i].len/DAY,r=6;
      x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=1;x.setLineDash([2,3]);x.beginPath();x.moveTo(px,Tp);x.lineTo(px,Tp+h);x.stroke();x.setLineDash([]);
      x.beginPath();x.arc(px,Tp,r,0,7);x.fillStyle='#171a3d';x.fill();
      if(f>.001){x.beginPath();x.moveTo(px,Tp);x.arc(px,Tp,r,-PI/2-f*PI,-PI/2+f*PI);x.closePath();x.fillStyle='#ffd166';x.fill()}
      x.beginPath();x.arc(px,Tp,r,0,7);x.strokeStyle='rgba(255,255,255,.45)';x.stroke()}
    const mark=(i,a,dots)=>{if(i<0||i>=n)return;const d=tb[i],px=X(i);x.strokeStyle=`rgba(255,255,255,${a})`;x.lineWidth=dots?1.5:1;x.setLineDash(dots?[]:[2,4]);x.beginPath();x.moveTo(px,Tp);x.lineTo(px,Tp+h);x.stroke();x.setLineDash([]);
      if(dots)for(const v of[d.sr,d.ss])if(v!=null){x.beginPath();x.arc(px,Y(v),4.500,0,7);x.fillStyle='#fff';x.fill();x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1;x.stroke()}};
    if(today!==sel)mark(today,.55,false);mark(sel,.95,true);
  }
  if(changed('yrT',loc.id+day.key)){
    const d=tb[sel],df=day.len-day.prev;
    $('yK').textContent='Daylight through '+year;$('yDate').textContent=dLong(d.start+DAY/2,loc.tz);
    $('yDelta').innerHTML=`<b style="font-size:17px;font-weight:500;color:var(--ink)">${durS(day.len)}</b><br><span class="${df<0?'down':'up'}">${delta(df)}</span> vs day before`;
    const north=loc.lat>=0,note=['Equal day and night','Longest day','Equal day and night','Shortest day'],tps=[year,year+1].flatMap(y=>[0,1,2,3].map(k=>({k,d:getDay(loc,seasonPoint(y,k))}))).filter(o=>o.d.start>=day.start).slice(0,4);
    $('cTurn').innerHTML=`<h3>Solstices and equinoxes</h3><div class="turn">${tps.map((o,i)=>{const nd=Math.round((o.d.wallMid-day.wallMid)/DAY);
      return`<button class="tp${i?'':' on'}" data-go="${o.d.start}" aria-label="Go to the ${SP[o.k]}">${glyph(o.d.len/DAY,34)}<span class="tn">${SP[o.k]}</span><span class="td">${dMed(o.d.start+DAY/2,loc.tz)}</span><span class="sub">${durS(o.d.len)} · ${inDays(nd).toLowerCase()}</span><span class="sub">${note[north?o.k:(o.k+2)%4]}</span></button>`}).join('')}</div>`;
    const mx=tb.reduce((a,b)=>b.len>a.len?b:a),mn=tb.reduce((a,b)=>b.len<a.len?b:a);
    $('cYear').innerHTML=`<div class="stats" style="margin-top:0"><div><span class="k">Sunrise</span><span class="v">${tH(day.t.sunrise,loc.tz)}</span></div><div><span class="k">Sunset</span><span class="v">${tH(day.t.sunset,loc.tz)}</span></div><div><span class="k">Longest day</span><span class="v">${durS(mx.len)}</span><span class="sub">${dMed(mx.start+DAY/2,loc.tz)}</span></div><div><span class="k">Shortest day</span><span class="v">${durS(mn.len)}</span><span class="sub">${dMed(mn.start+DAY/2,loc.tz)}</span></div></div>`;
  }
}
function render(){
  const ts=T(),day=getDay(S.loc,ts);
  if(shown(hero))renderHero(day,ts);else{const k=sky(sunPos(ts,S.loc.lat,S.loc.lng).alt),top=k[0],acc=k[5],r=document.documentElement.style;r.setProperty('--accent',rgb(acc));r.setProperty('--pane',rgb(top.map((v,i)=>Math.round(v*.2+[5,7,13][i]))))}
  const live=S.view==null||!!S.anim||S.scrub;if(changed('live',live)){$('backBtn').hidden=live;document.querySelectorAll('[data-now]').forEach(b=>b.hidden=live)}
  if(shown($('overview')))renderOverview(day,ts);
  if(shown($('events')))renderEvents(day,ts);
  if(shown($('year')))renderYear(day,ts);
}
let queued=0;const schedule=()=>{if(!queued)queued=requestAnimationFrame(()=>{queued=0;render()})};

/* ───────── Motion: travel through time ───────── */
function travel(target,ms=1000){
  cancelAnimationFrame(S.anim);S.anim=0;
  if(reduced){S.view=target;render();return}
  const from=T(),t0=performance.now();
  const step=now=>{
    const p=Math.min(1,(now-t0)/ms),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,to=target??Date.now(),dd=Math.round((to-from)/DAY);
    S.view=Math.abs(to-from)<DAY*1.5?from+(to-from)*e:from+Math.round(dd*e)*DAY+(to-from-dd*DAY)*e;
    if(p<1)S.anim=requestAnimationFrame(step);else{S.view=target;S.anim=0}
    render();
  };
  S.anim=requestAnimationFrame(step);
}
function setView(ts){cancelAnimationFrame(S.anim);S.anim=0;S.view=ts;schedule()}

/* ───────── Interaction ───────── */
const wideMQ=matchMedia('(min-width:1240px)');
function setTab(tab,keep){
  S.tab=tab;const eff=tab==='all'&&!wideMQ.matches?'today':tab;$('app').dataset.tab=eff;
  [...$('tabs').children].forEach((b,i)=>{const on=b.dataset.tab===eff;b.setAttribute('aria-selected',on);if(on)$('tabs').style.setProperty('--i',i)});
  persist();if(!keep){$('app').scrollTop=0;$('pane').scrollTop=0}render();
}
wideMQ.addEventListener('change',()=>setTab(S.tab,true));
function setClock(v){H24=v;for(const k in memo)delete memo[k];$('hcBtn').textContent=H24?'24h':'12h';persist();render()}
$('hcBtn').addEventListener('click',()=>setClock(!H24));
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)});

let drag=null;
hero.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,on:e.pointerType==='mouse',id:e.pointerId};if(drag.on){S.scrub=true;hero.setPointerCapture(e.pointerId);scrubTo(e)}});
hero.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.on){const dx=Math.abs(e.clientX-drag.x),dy=Math.abs(e.clientY-drag.y);if(dx>8&&dx>dy){drag.on=true;S.scrub=true;try{hero.setPointerCapture(drag.id)}catch(_){}}else if(dy>10){drag=null;return}}if(drag.on)scrubTo(e)});
const endDrag=e=>{if(!drag)return;if(!drag.on&&e.type==='pointerup'&&Math.abs(e.clientX-drag.x)<8)scrubTo(e);drag=null;S.scrub=false;schedule()};
hero.addEventListener('pointerup',endDrag);hero.addEventListener('pointercancel',endDrag);
function scrubTo(e){const r=hero.getBoundingClientRect(),day=getDay(S.loc,T());$('hint').classList.add('off');setView(day.start+clamp((e.clientX-r.left)/r.width,0,.9999)*DAY)}
hero.addEventListener('keydown',e=>{const k={ArrowLeft:-6e5,ArrowRight:6e5,ArrowDown:-HR,ArrowUp:HR,PageDown:-DAY,PageUp:DAY}[e.key];if(k){e.preventDefault();$('hint').classList.add('off');setView(T()+k)}else if(e.key==='Escape'||e.key==='Home'){travel(null)}});
document.addEventListener('click',e=>{if(e.target.closest('#backBtn,[data-now]'))travel(null,1100);const g=e.target.closest('[data-go]');if(g)travel(+g.dataset.go+(T()-getDay(S.loc,T()).start),1300)});

let cdrag=false;
const pick=e=>{if(!cg)return;const r=box.getBoundingClientRect(),i=clamp(Math.round((e.clientX-r.left-cg.L)/cg.w*(cg.n-1)),0,cg.n-1),day=getDay(S.loc,T());setView(cg.tb[i].start+(T()-day.start))};
box.addEventListener('pointerdown',e=>{cdrag=true;try{box.setPointerCapture(e.pointerId)}catch(_){}pick(e)});
box.addEventListener('pointermove',e=>{if(cdrag)pick(e)});
for(const ev of['pointerup','pointercancel'])box.addEventListener(ev,()=>cdrag=false);

/* Places */
const scrim=$('scrim'),q=$('q');
function placeRow(p,i,isSaved){
  const now=Date.now(),pos=sunPos(now,p.lat,p.lng),[top,,,,hor]=sky(pos.alt),[a,b]=phaseName(pos.alt,sunPos(now+6e4,p.lat,p.lng).alt>pos.alt);
  return`<div class="place" ${isSaved&&p.id===S.loc.id?'aria-current="true"':''}><button data-${isSaved?'sel':'add'}="${esc(p.id)}" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left"><i class="orb" style="background:linear-gradient(${rgb(top)},${rgb(hor)})"></i><span class="l"><b>${esc(p.name)}</b><em>${esc(p.country)}</em></span><span class="t">${tH(now,p.tz)}<em>${a} ${b}</em></span></button>${isSaved&&S.places.length>1?`<button class="rm" data-rm="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">×</button>`:''}</div>`;
}
function renderPlaces(){
  const s=q.value.trim().toLowerCase();
  if(!s){$('plist').innerHTML=S.places.map((p,i)=>placeRow(p,i,true)).join('');return}
  const hits=CITIES.filter(c=>(c.name+' '+c.country).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(s.normalize('NFD').replace(/[̀-ͯ]/g,''))).slice(0,12);
  $('plist').innerHTML=hits.length?hits.map((p,i)=>placeRow(p,i,false)).join(''):`<p class="sub" style="padding:14px 4px">No city matches “${esc(q.value)}”. Try a larger city nearby.</p>`;
}
function choose(p){S.loc=p;persist();closeSheet();travel(S.view,1)}
const openSheet=()=>{q.value='';scrim.hidden=false;renderPlaces()},closeSheet=()=>{scrim.hidden=true;$('locBtn').focus()};
$('locBtn').addEventListener('click',openSheet);$('doneBtn').addEventListener('click',closeSheet);
scrim.addEventListener('click',e=>{if(e.target===scrim)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!scrim.hidden)closeSheet()});
q.addEventListener('input',renderPlaces);
$('plist').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.sel)choose(S.places.find(p=>p.id===d.sel));
  else if(d.add){const c=S.places.find(p=>p.id===d.add)||CITIES.find(p=>p.id===d.add);if(!S.places.includes(c))S.places.unshift(c);choose(c)}
  else if(d.rm){S.places=S.places.filter(p=>p.id!==d.rm);if(S.loc.id===d.rm)S.loc=S.places[0];persist();renderPlaces();render()}
});
let toastT;const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4200)};
$('hereBtn').addEventListener('click',()=>{
  const fail=()=>toast('Your location isn’t available here. Pick a city instead.');
  try{navigator.geolocation.getCurrentPosition(g=>{
    const{latitude:lat,longitude:lng}=g.coords,near=CITIES.map(c=>[Math.hypot(c.lat-lat,(c.lng-lng)*cos(lat*rad)),c]).sort((a,b)=>a[0]-b[0])[0];
    const p={id:'here',name:near[0]<.6?near[1].name:lat.toFixed(2)+'°, '+lng.toFixed(2)+'°',country:'Current location',lat,lng,tz:myTz};
    dayCache.clear();for(const k in yearCache)if(k.startsWith('here'))delete yearCache[k];for(const k in memo)delete memo[k];
    S.places=[p,...S.places.filter(x=>x.id!=='here')];choose(p);
  },fail,{timeout:8000,maximumAge:6e5})}catch(e){fail()}
});

/* Install: Chromium offers a prompt we can trigger from our own button; other browsers install from their menus */
let instEv=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;$('instBtn').hidden=false});
addEventListener('appinstalled',()=>{instEv=null;$('instBtn').hidden=true});
$('instBtn').addEventListener('click',async()=>{if(!instEv)return;instEv.prompt();try{await instEv.userChoice}catch(e){}instEv=null;$('instBtn').hidden=true});

/* ───────── Boot ───────── */
new ResizeObserver(schedule).observe(hero);new ResizeObserver(schedule).observe(box);
setInterval(()=>{if(S.view==null&&!S.anim&&!document.hidden)render()},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule()});
$('hcBtn').textContent=H24?'24h':'12h';
setTab(['sky','today','year','events','all'].includes(S.tab)?S.tab:(wideMQ.matches?'all':'today'));
if(!reduced){S.view=getDay(S.loc,Date.now()).start;render();travel(null,2400)}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{memo.yr=null;schedule()});
})();
</script>
